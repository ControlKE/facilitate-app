; Raises PHP's per-directory upload limits so phone-camera photos of the
; mileage form (often 5-10MB) aren't silently rejected before our own code
; ever sees them. Applies to this directory (src/php -> dist/php on deploy)
; on PHP-FPM hosts that honour .user.ini, which includes One.com. Takes a
; few minutes to take effect after deploy (PHP re-reads .user.ini on an
; interval, default 300s).
upload_max_filesize = 20M
post_max_size = 25M
max_execution_time = 60
